# NOTE on the `:-` fallbacks below: they only exist so `compose up` still
# works out of the box on localhost if you forget to run
# `cp .env.example .env` first (podman-compose, unlike Docker Compose,
# substitutes undefined variables with an empty string *silently*, which
# otherwise crashes Postgres with a confusing "superuser password is not
# specified" error). They are NOT safe secrets - copy .env.example to .env
# and set real values before running this anywhere but your own machine.
services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webmius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webmius-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-webmius}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webmius}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-webmius}:${POSTGRES_PASSWORD:-webmius-dev-password}@db:5432/${POSTGRES_DB:-webmius}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-do-not-use-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-do-not-use-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # "prod-like" profile: a TLS-terminating reverse proxy in front of the dev
  # services, for exercising HTTPS/Secure-cookie behavior locally. Not part
  # of the default `podman compose up`. See README for usage.
  proxy:
    image: docker.io/library/caddy:2-alpine
    profiles: ["prod"]
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    ports:
      # Rootless Podman can't bind :443 without a sysctl change, so the host
      # port defaults higher; a rootful/production host can override this to
      # 443 via PROXY_PORT.
      - "${PROXY_PORT:-8443}:443"

volumes:
  db_data:
  caddy_data:
  caddy_config:
